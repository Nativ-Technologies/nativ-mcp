<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nativ localisation review</title>
<style>
:root{font:14px/1.5 system-ui,-apple-system,sans-serif;color:#193430;background:#fff;color-scheme:light dark}*{box-sizing:border-box}body{margin:0;padding:22px}header{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:18px}.brand{font-size:23px;letter-spacing:-1px;font-weight:750}.dot{color:#1d916c}h1{font-size:17px;margin:0}.status{background:#eaf4ee;color:#245b41;border-radius:6px;padding:3px 8px;font-size:12px}.intro{color:#64716d;font-size:13px;margin:6px 0 18px}.row{border:1px solid #dce5de;border-radius:12px;margin:12px 0;overflow:hidden}.pair{display:grid;grid-template-columns:1fr 1fr}.cell{padding:15px;white-space:pre-wrap;overflow-wrap:anywhere}.cell+ .cell{border-left:1px solid #dce5de;background:#f6faf7}.label{display:block;white-space:normal;font-size:10px;letter-spacing:1px;text-transform:uppercase;font-weight:650;color:#64716d;margin-bottom:7px}.copy{font-size:16px}.details{border-top:1px solid #e4ebe6;padding:10px 15px;font-size:12px;color:#56655d}.count{margin-top:8px;font-size:11px;color:#62756a}.warn{color:#a64219}details{margin-top:6px}summary{cursor:pointer}button{background:#1e5545;color:white;border:0;border-radius:7px;padding:9px 13px;font:inherit;cursor:pointer}button.secondary{background:#edf3ef;color:#254d3b}footer{display:flex;gap:8px;align-items:center;margin-top:18px;flex-wrap:wrap}.feedback{font-size:12px;color:#53655a}img{max-width:100%;border-radius:8px}a{color:#1f634b}.artifact{margin-top:16px} @media(max-width:440px){body{padding:14px}.pair{grid-template-columns:1fr}.cell+ .cell{border-left:0;border-top:1px solid #dce5de}}@media(prefers-color-scheme:dark){:root{color:#e3eee7;background:#18251f}.row,.cell+ .cell,.details{border-color:#3a4c41}.cell+ .cell{background:#203229}.label,.intro,.details,.count,.feedback{color:#b4c5b8}.status{background:#254233;color:#bce2c3}a{color:#a3d5b2}button.secondary{background:#344d3e;color:#e0eee1}}
</style></head><body>
<header><span class="brand">nativ<span class="dot">.</span></span><span class="status">Draft for review</span></header>
<h1 id="heading">Localisation review</h1><p class="intro" id="intro">Your translated copy will appear here. Review meaning, terminology and tone before use.</p>
<main id="results" aria-live="polite"></main><section id="artifacts"></section>
<footer><button id="copy" hidden>Copy translations</button><span class="feedback" id="feedback" role="status"></span></footer><section id="manual-copy" hidden><label for="copy-text">Copy-ready translations</label><textarea id="copy-text" readonly rows="4" style="display:block;width:100%;margin-top:8px;font:inherit"></textarea><p class="intro">Press ⌘C on Mac or Ctrl+C on Windows to copy the selected wording.</p></section>
<script>
let latest;let nextId=1;const pending=new Map();
const el=id=>document.getElementById(id);
function node(tag,text,cls){const n=document.createElement(tag);if(text!=null)n.textContent=String(text);if(cls)n.className=cls;return n}
function render(data){if(!data||!Array.isArray(data.items))return;latest=data;el('feedback').textContent=data.export_error||'';el('manual-copy').hidden=true;el('intro').textContent='Review meaning, terminology and tone. Ask in the conversation to refine this draft.';el('heading').textContent=data.language?`Localised for ${data.language}`:'Creative localisation';el('results').replaceChildren();el('artifacts').replaceChildren();for(const item of data.items){const row=node('article',null,'row');const pair=node('div',null,'pair');for(const [label,text]of [['Source',item.source],['Localised copy',item.translation]]){const cell=node('div',null,'cell');cell.append(node('span',label,'label'),node('div',text,'copy'));if(label==='Localised copy'&&item.characters!=null)cell.append(node('div',`${item.characters}${item.max_characters?' / '+item.max_characters:''} characters${item.over_limit?' · over limit':''}`,item.over_limit?'count warn':'count'));pair.append(cell)}row.append(pair);if(item.rationale||item.backtranslation||item.tm_match){const detail=node('div',null,'details');if(item.tm_match?.score!=null)detail.append(node('div',`Translation memory: ${item.tm_match.score}% match`));if(item.backtranslation)detail.append(node('div','Backtranslation: '+item.backtranslation));if(item.rationale){const explanation=node('details');explanation.append(node('summary','Wording notes'),node('p',item.rationale));detail.append(explanation)}row.append(detail)}el('results').append(row)}for(const file of data.artifacts||[]){let url;try{url=new URL(file.url)}catch{continue}if(url.protocol!=='https:'||url.hostname!=='storage.googleapis.com')continue;const section=node('div',null,'artifact');if(String(file.mime_type).startsWith('image/')){const img=node('img');img.src=url.href;img.alt='Generated localised creative';section.append(img)}const link=node('a','Download '+(file.filename||'creative'));link.href=url.href;link.target='_blank';link.rel='noopener noreferrer';section.append(link,node('p','Download links expire. Review the creative before using it.','intro'));el('artifacts').append(section)}el('copy').hidden=!data.items.length;resize()}
function notify(method,params){window.parent.postMessage({jsonrpc:'2.0',method,params},'*')}
function request(method,params){const id=nextId++;return new Promise((resolve,reject)=>{pending.set(id,{resolve,reject});window.parent.postMessage({jsonrpc:'2.0',id,method,params},'*');setTimeout(()=>{if(pending.has(id)){pending.delete(id);reject(new Error('Host unavailable'))}},8000)})}
function resize(){notify('ui/notifications/size-changed',{height:document.documentElement.scrollHeight})}
window.addEventListener('message',event=>{if(event.source!==window.parent)return;const m=event.data;if(!m||m.jsonrpc!=='2.0')return;if(pending.has(m.id)){const p=pending.get(m.id);pending.delete(m.id);m.error?p.reject(m.error):p.resolve(m.result);return}if(m.method==='ui/notifications/tool-result')render(m.params?.structuredContent);if(m.method==='ui/notifications/tool-cancelled'){el('intro').textContent='This localisation was cancelled.'}}, {passive:true});
el('copy').onclick=async()=>{try{await navigator.clipboard.writeText(latest.items.map(i=>i.translation).join('\n'));el('feedback').textContent='Translations copied.'}catch{el('manual-copy').hidden=false;el('copy-text').value=latest.items.map(i=>i.translation).join('\n');el('copy-text').focus();el('copy-text').select();el('feedback').textContent='Wording selected. Press ⌘C or Ctrl+C to copy.';resize()}};
request('ui/initialize',{appInfo:{name:'Nativ review',version:'1.0.0'},appCapabilities:{},protocolVersion:'2026-01-26'}).then(()=>{notify('ui/notifications/initialized',{});resize()}).catch(()=>{});
if(window.openai?.toolOutput)render(window.openai.toolOutput);
</script></body></html>
