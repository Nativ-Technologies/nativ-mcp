[project]
name = "nativ-mcp"
version = "0.4.0"
description = "MCP server for Nativ — AI-powered localization platform. Translate text, manage translation memory, and access style guides from any MCP-compatible AI tool."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
    { name = "Nativ", email = "hello@usenativ.com" },
]
keywords = [
    "mcp",
    "localization",
    "translation",
    "i18n",
    "l10n",
    "nativ",
    "ai",
    "translation-memory",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Internationalization",
    "Topic :: Software Development :: Localization",
]
dependencies = [
    "mcp>=2.0.0,<3",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
hosted = [
    "google-cloud-storage>=3.0.0,<4",
    "uvicorn>=0.30.0,<1",
    "jsonschema>=4.20.0,<5",
]

[project.scripts]
nativ-mcp = "nativ_mcp.server:main"
nativ-mcp-http = "nativ_mcp.hosted:main"

[project.urls]
Homepage = "https://usenativ.com"
Repository = "https://github.com/Nativ-Technologies/nativ-mcp"
Documentation = "https://github.com/Nativ-Technologies/nativ-mcp#readme"
Issues = "https://github.com/Nativ-Technologies/nativ-mcp/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nativ_mcp"]

[tool.hatch.build.targets.wheel.force-include]
"src/nativ_mcp/rest-openapi.json" = "nativ_mcp/rest-openapi.json"

[tool.hatch.build.targets.sdist]
include = [
    "/src/nativ_mcp",
    "/tests",
    "/docs/hosting.md",
    "/pyproject.toml",
    "/README.md",
    "/README.fr.md",
    "/LICENSE",
    "/server.json",
]
